<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOS Staff Panel</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5f9ff;
}

header {
  background: linear-gradient(135deg, #ff6b6b, #ffb3b3);
  padding: 20px;
  text-align: center;
  color: white;
  font-size: 26px;
}

.alert-bar {
  background: #ffe6e6;
  color: #d32f2f;
  text-align: center;
  padding: 10px;
  font-weight: bold;
}

/* ✅ STATS BAR */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap: 10px;
  padding: 15px;
}

.stat-box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.stat-box h2 {
  margin: 0;
  color: #ff5252;
}

.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  position: relative;
}

.status {
  position: absolute;
  top: 15px;
  right: 15px;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  color: white;
}

.high { background: #ff5252; }
.medium { background: #ffb74d; }
.low { background: #66bb6a; }

button {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-right: 10px;
}

.accept { background: #4caf50; color: white; }
.resolve { background: #2196f3; color: white; }

footer {
  text-align: center;
  padding: 15px;
  font-size: 13px;
  color: #777;
}
</style>
</head>

<body>

<header>🚨 SOS STAFF CONTROL PANEL</header>

<div class="alert-bar">⚠️ LIVE EMERGENCY ALERTS ACTIVE</div>

<!-- ✅ COUNTS -->
<div class="stats">
  <div class="stat-box">
    <h2 id="total">0</h2>
    <p>Total</p>
  </div>
  <div class="stat-box">
    <h2 id="active">0</h2>
    <p>Active</p>
  </div>
  <div class="stat-box">
    <h2 id="accepted">0</h2>
    <p>Accepted</p>
  </div>
  <div class="stat-box">
    <h2 id="resolved">0</h2>
    <p>Resolved</p>
  </div>
</div>

<div class="container" id="alertsContainer"></div>

<footer>© 2026 SOS Emergency Response System</footer>

<script>

let alerts = [];

async function fetchAlerts(){
  const res = await fetch("https://sos-backend-c95v.onrender.com/api/alerts");
  alerts = await res.json();

  render(alerts);
  updateCounts(alerts);   // ✅ update stats
}

function render(list){
  const container = document.getElementById("alertsContainer");
  container.innerHTML = "";

  list.forEach(a => {
    container.innerHTML += `
      <div class="card">
        <span class="status ${getColor(a.level)}">${a.level}</span>

        <h3>👤 ${a.name}</h3>
        <p>📍 ${a.area}</p>
        <p>🆘 ${a.type}</p>
        <p>Status: <b>${a.status}</b></p>

        <div>
          ${
            a.status === "active"
            ? `<button class="accept" onclick="acceptAlert('${a.name}')">Accept</button>`
            : ""
          }

          ${
            a.status !== "resolved"
            ? `<button class="resolve" onclick="resolveAlert('${a.name}')">Resolve</button>`
            : `<span style="color:green">✔ Done</span>`
          }
        </div>
      </div>
    `;
  });
}

// ✅ COUNT FUNCTION (FIX)
function updateCounts(data){
  document.getElementById("total").innerText = data.length;
  document.getElementById("active").innerText =
    data.filter(a => a.status === "active").length;

  document.getElementById("accepted").innerText =
    data.filter(a => a.status === "accepted").length;

  document.getElementById("resolved").innerText =
    data.filter(a => a.status === "resolved").length;
}

function getColor(level){
  if(!level) return "low";
  if(level.toLowerCase().includes("high")) return "high";
  if(level.toLowerCase().includes("medium")) return "medium";
  return "low";
}

// 🔹 Accept
async function acceptAlert(name){
  await fetch(`https://sos-backend-c95v.onrender.com/api/accept/${name}`, {
    method: "PUT"
  });
  fetchAlerts();
}

// 🔹 Resolve
async function resolveAlert(name){
  await fetch(`https://sos-backend-c95v.onrender.com/api/resolve/${name}`, {
    method: "PUT"
  });
  fetchAlerts();
}

// 🔁 AUTO REFRESH
setInterval(fetchAlerts, 5000);

// first load
fetchAlerts();

</script>

</body>
</html>
