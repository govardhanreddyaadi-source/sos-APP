<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Dashboard</title>

<style>
:root{
  --primary:#2563eb;
  --bg:#f6f9fc;
  --card:#ffffff;
  --border:#e2e8f0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  display:flex;
  background:var(--bg);
  color:#1e293b;
}

/* SIDEBAR */
.sidebar{
  width:230px;
  height:100vh;
  background:var(--card);
  padding:20px;
  border-right:1px solid var(--border);
}

.sidebar h2{
  color:var(--primary);
  margin-bottom:25px;
}

.sidebar li{
  list-style:none;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

.sidebar li.active,
.sidebar li:hover{
  background:#e0f2fe;
  transform:translateX(4px);
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.search{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  width:260px;
}

.profile{
  display:flex;
  gap:15px;
  align-items:center;
}

.badge{
  background:#e0f2fe;
  padding:6px 10px;
  border-radius:10px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.high{border-left:5px solid #ef4444;}
.medium{border-left:5px solid #facc15;}
.low{border-left:5px solid #22c55e;}

/* FILTER */
.filters button{
  padding:8px 14px;
  margin-right:10px;
  border:none;
  border-radius:20px;
  background:#e2e8f0;
  cursor:pointer;
}

/* ALERTS */
.alerts{
  display:grid;
  gap:12px;
  margin:15px 0;
}

.alert{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  transition:0.2s;
}

.alert:hover{
  transform:translateX(6px);
}

.tag{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

.high-tag{background:#fee2e2;color:#b91c1c;}
.medium-tag{background:#fef9c3;color:#92400e;}
.low-tag{background:#dcfce7;color:#166534;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

/* PROGRESS */
.progress{
  height:10px;
  background:#e2e8f0;
  border-radius:10px;
  margin:8px 0;
}

.progress div{
  height:100%;
  border-radius:10px;
}

.red{width:60%;background:#ef4444;}
.yellow{width:40%;background:#facc15;}
.green{width:80%;background:#22c55e;}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{display:none;}
  .stats{grid-template-columns:1fr 1fr;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🌿 Live</h2>
  <ul>
  <li class="active"><a href="DashBoard.html">Dashboard</a></li>
  <li><a href="alert.html">Alerts</a></li>
  <li><a href="Users.html">Users</a></li>
  <li><a href="Reports.html">Reports</a></li>
</ul>
</div>

<div class="main">

  <div class="topbar">
    <input class="search" id="search" placeholder="Search alerts...">
    <div class="profile">
      <div class="badge">🔔 <span id="count">0</span></div>
      <div>👤 Admin</div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="card"><h2 id="total">0</h2><p>Total</p></div>
    <div class="card high"><h2 id="high">0</h2><p>High</p></div>
    <div class="card medium"><h2 id="medium">0</h2><p>Medium</p></div>
    <div class="card low"><h2 id="low">0</h2><p>Low</p></div>
  </div>

  <!-- FILTER -->
  <div class="filters">
    <button onclick="filter('all')">All</button>
    <button onclick="filter('high')">High</button>
    <button onclick="filter('medium')">Medium</button>
    <button onclick="filter('low')">Low</button>
  </div>

  <!-- ALERTS -->
  <div class="alerts" id="alerts"></div>

  <!-- GRID -->
  <div class="grid">
    <div class="box">
      <h3>System Health</h3>
      Server<div class="progress"><div class="red"></div></div>
      GPS<div class="progress"><div class="green"></div></div>
      Notification<div class="progress"><div class="yellow"></div></div>
    </div>

    <div class="box">
      <h3>Activity</h3>
      <p>✔ Alert Created</p>
      <p>✔ Team Notified</p>
      <p>✔ Action Taken</p>
    </div>
  </div>

</div>

<script>
let data = [];

async function loadData() {
  const res = await fetch("https://sos-backend-c95v.onrender.com/api/alerts");
  data = await res.json();
  render(data);
}

loadData();
</script>

</body>
</html>
