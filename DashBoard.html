<script>
let data = [];
let filtered = [];

async function loadData() {
  try {
    const res = await fetch("https://sos-backend-c95v.onrender.com/api/alerts");
    data = await res.json();
    filtered = data;
    render(filtered);
  } catch (err) {
    console.error("Failed to load alerts:", err);
  }
}

/* RENDER ALERTS */
function render(list) {
  const container = document.getElementById("alerts");
  container.innerHTML = "";

  let high = 0, medium = 0, low = 0;

  list.forEach(a => {
    const level = a.level?.toLowerCase() || "low";

    if(level === "high") high++;
    else if(level === "medium") medium++;
    else low++;

    const div = document.createElement("div");
    div.className = "alert";

    div.innerHTML = `
      <span>${a.message || "No message"}</span>
      <span class="tag ${level}-tag">${level}</span>
    `;

    container.appendChild(div);
  });

  /* UPDATE STATS */
  document.getElementById("total").innerText = list.length;
  document.getElementById("high").innerText = high;
  document.getElementById("medium").innerText = medium;
  document.getElementById("low").innerText = low;
  document.getElementById("count").innerText = list.length;
}

/* FILTER */
function filter(type) {
  if (type === "all") {
    filtered = data;
  } else {
    filtered = data.filter(a => a.level?.toLowerCase() === type);
  }
  render(filtered);
}

/* SEARCH */
document.getElementById("search").addEventListener("input", e => {
  const value = e.target.value.toLowerCase();

  const result = filtered.filter(a =>
    (a.message || "").toLowerCase().includes(value)
  );

  render(result);
});

loadData();
</script>
